name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pi:
    name: Pi runtime
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install package metadata
        run: npm ci --ignore-scripts

      - name: Install Pi host peers
        run: npm install --no-save --ignore-scripts @earendil-works/pi-coding-agent typebox

      - name: Syntax
        run: npm run syntax

      - name: Pi package tests
        run: npm test

      - name: Pi extension smoke
        run: npm run smoke:pi

      - name: Package dry run
        run: npm pack --dry-run

  ci-gate:
    name: CI Gate
    needs: [pi]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify Pi runtime passed
        run: |
          echo "pi: ${{ needs.pi.result }}"
          test "${{ needs.pi.result }}" = "success"

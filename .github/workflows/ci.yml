name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  diag-runner:
    name: diagnostic (runner)
    runs-on: ubuntu-latest
    steps:
      - name: Runner
        run: echo runner-ok

  diag-checkout:
    name: diagnostic (checkout)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout complete
        run: echo checkout-ok

  diag-node:
    name: diagnostic (node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js without cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node
        run: node --version

  diag-npm:
    name: diagnostic (npm-ci)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js without cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci
        run: npm ci --ignore-scripts

  static:
    name: static (${{ matrix.check }})
    strategy:
      fail-fast: false
      matrix:
        check:
          - syntax
          - validate
          - evals
          - evals:router
          - evals:live:validate
          - evals:long:validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install package metadata
        run: npm ci --ignore-scripts

      - name: Run ${{ matrix.check }}
        run: npm run ${{ matrix.check }}

  unit:
    name: unit (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install package metadata
        run: npm ci --ignore-scripts

      - name: Run unit/integration tests
        run: npm test

  package:
    name: package-smoke (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install package metadata
        run: npm ci --ignore-scripts

      - name: Dry-run package
        run: npm pack --dry-run

      - name: Packed global-install smoke
        run: npm run smoke:pack

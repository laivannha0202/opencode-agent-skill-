name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: static (${{ matrix.check }})
    strategy:
      fail-fast: false
      matrix:
        check:
          - syntax
          - validate
          - docs:check
          - evals
          - evals:router
          - evals:live:validate
          - evals:long:validate
          - evals:polyglot:validate
          - evals:v11:validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install package metadata
        run: npm ci --ignore-scripts

      - name: Run ${{ matrix.check }}
        run: npm run ${{ matrix.check }}

  unit:
    name: unit (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install package metadata
        run: npm ci --ignore-scripts

      - name: Run unit/integration tests
        run: npm test

  package:
    name: package-smoke (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install package metadata
        run: npm ci --ignore-scripts

      - name: Dry-run package
        run: npm pack --dry-run

      - name: Packed global-install smoke
        run: npm run smoke:pack

      - name: Plain one-command install smoke
        run: npm run smoke:plain-install

  ci-gate:
    name: CI Gate
    needs: [static, unit, package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required CI jobs passed
        run: |
          failed=0
          for entry in "static:${{ needs.static.result }}" "unit:${{ needs.unit.result }}" "package:${{ needs.package.result }}"; do
            name="${entry%%:*}"
            result="${entry##*:}"
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              echo "FAIL: $name did not pass (status: $result)"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "CI Gate FAILED: one or more required jobs failed or were cancelled"
            exit 1
          fi
          echo "CI Gate PASSED: all required jobs succeeded"

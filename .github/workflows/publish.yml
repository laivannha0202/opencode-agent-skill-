name: Publish npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install package metadata
        run: npm ci --ignore-scripts

      - name: Validate package
        run: npm run ci

      - name: Verify release tag
        run: npm run release:check-tag

      - name: Check registry for this exact version
        id: registry
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "opencode-agent-skill@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "opencode-agent-skill@$VERSION is already published; skipping duplicate publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with npm Trusted Publishing
        if: steps.registry.outputs.published != 'true'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then
            npm publish --access public --provenance --tag next
          else
            npm publish --access public --provenance
          fi
